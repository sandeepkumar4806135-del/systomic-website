    <script>
        // Admin credentials
        const ADMIN_EMAIL = 'ram@gmail.com';
        const ADMIN_PASSWORD = 'ram129';

        // Global submissions array (declared first so all functions can use it)
        let allSubmissions = [];

        // Check if already logged in
        if (localStorage.getItem('systomicAdminLoggedIn') === 'true') {
            showDashboard();
        }

        // Login handler
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;

            if (email === ADMIN_EMAIL && password === ADMIN_PASSWORD) {
                localStorage.setItem('systomicAdminLoggedIn', 'true');
                showDashboard();
            } else {
                document.getElementById('loginError').classList.add('show');
            }
        });

// Show dashboard
function showDashboard() {
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('dashboard').classList.add('show');
    loadSubmissionsFromFirebase();
    setupFirebaseListener();
}

// Load submissions from Firebase
function loadSubmissionsFromFirebase() {
    try {
        if (typeof firebase === 'undefined' || !firebase.database) {
            console.error('Firebase not available');
            return;
        }
        
        const db = firebase.database();
        const submissionsRef = db.ref('submissions');
        
        submissionsRef.once('value', function(snapshot) {
            hideFirebaseError();
            allSubmissions = [];
            
            if (snapshot.exists()) {
                snapshot.forEach(function(childSnapshot) {
                    const data = childSnapshot.val();
                    data.firebaseKey = childSnapshot.key;
                    allSubmissions.push(data);
                });
            }
            
            allSubmissions.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
            renderClients();
        }, function(err) {
            console.error('Firebase load error:', err);
            showFirebaseError(err.message + ' (code: ' + err.code + ')');
            renderClients();
        });
    } catch (err) {
        console.error('Firebase load error:', err);
    }
}

// Setup Firebase real-time listener
function setupFirebaseListener() {
    try {
        if (typeof firebase === 'undefined' || !firebase.database) {
            console.warn('Firebase not available');
            return;
        }
        
        const db = firebase.database();
        const submissionsRef = db.ref('submissions');
        
        submissionsRef.on('child_added', function(snapshot) {
            const data = snapshot.val();
            data.firebaseKey = snapshot.key;
            
            const exists = allSubmissions.some(s => s.firebaseKey === data.firebaseKey);
            if (!exists) {
                allSubmissions.unshift(data);
                renderClients();
                showNewSubmissionNotification(data.order?.businessName || 'New submission');
            }
        }, function(err) {
            console.error('Firebase listener error:', err);
            showFirebaseError(err.message + ' (code: ' + err.code + ')');
        });
        
        submissionsRef.on('child_changed', function(snapshot) {
            const data = snapshot.val();
            data.firebaseKey = snapshot.key;
            
            const index = allSubmissions.findIndex(s => s.firebaseKey === data.firebaseKey);
            if (index !== -1) {
                allSubmissions[index] = data;
                renderClients();
            }
        }, function(err) {
            console.error('Firebase listener error:', err);
            showFirebaseError(err.message + ' (code: ' + err.code + ')');
        });
        
        console.log('Real-time Firebase listener active');
    } catch (err) {
        console.warn('Firebase listener error:', err);
    }
}

// Firebase error banner helpers
function showFirebaseError(msg) {
    const banner = document.getElementById('firebaseErrorBanner');
    const msgEl = document.getElementById('firebaseErrorMsg');
    if (banner && msgEl) {
        msgEl.textContent = msg;
        banner.classList.add('show');
    }
}

function hideFirebaseError() {
    const banner = document.getElementById('firebaseErrorBanner');
    if (banner) banner.classList.remove('show');
}

// Show notification for new submissions
function showNewSubmissionNotification(businessName) {
    const toast = document.createElement('div');

        position: fixed;
        top: 20px;
        right: 20px;
        background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        color: #0a0e27;
        padding: 15px 25px;
        border-radius: 10px;
        font-weight: 600;
        font-size: 0.9rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        z-index: 10000;
        animation: slideInFromRight 0.3s ease;
    `;
    toast.textContent = `📋 New submission: ${businessName}`;
    
    document.body.appendChild(toast);
    
    setTimeout(() => {
        toast.style.opacity = '0';

// Logout
function logout() {
    localStorage.removeItem('systomicAdminLoggedIn');

// View switching
function showView(view) {
    var viewClients = document.getElementById('viewClients');
    var viewDetail = document.getElementById('viewDetail');

    if (view === 'clients') {
        if (viewClients) viewClients.style.display = 'block';
        if (viewDetail) viewDetail.classList.remove('show');
    } else if (view === 'detail') {
        if (viewClients) viewClients.style.display = 'none';
        if (viewDetail) {
            viewDetail.classList.add('show');
        }
    }
    
    document.querySelectorAll('.nav-item').forEach(function(item) {
        item.classList.remove('active');
    });
    var navClients = document.getElementById('navClients');
    if (navClients) navClients.classList.add('active');
}

        // Get status label
        function getStatusLabel(status) {
            return status || 'New';
        }

        // Get status class
        function getStatusClass(status) {
            const s = status || 'New';
            return 'status-' + s.toLowerCase().replace(/\s+/g, '-');
        }

        // Render clients from Firebase data
        function renderClients() {
            const submissions = allSubmissions;
            
            // Stats
            const statsGrid = document.getElementById('statsGrid');
            const totalClients = submissions.length;
            const totalRestaurants = submissions.filter(s => s.order && s.order.businessType === 'restaurants').length;
            const totalPremium = submissions.filter(s => s.order && s.order.websiteLevel === 'premium').length;
            const totalNew = submissions.filter(s => (s.status || 'New') === 'New').length;
            
            statsGrid.innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${totalClients}</div>
                    <div class="stat-label">Total Clients</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${totalNew}</div>
                    <div class="stat-label">New</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${submissions.filter(s => (s.status || 'New') === 'In Review').length}</div>
                    <div class="stat-label">In Review</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${submissions.filter(s => (s.status || 'New') === 'Approved').length}</div>
                    <div class="stat-label">Approved</div>
                </div>
            `;

            // Clients list
            const clientsList = document.getElementById('clientsList');

            if (submissions.length === 0) {
                clientsList.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <p>No client submissions yet</p>
                    </div>
                `;
                return;
            }

            // Sort by newest first
            submissions.sort((a, b) => {
                const dateA = new Date(a.date || 0);
                const dateB = new Date(b.date || 0);
                return dateB - dateA;
            });

clientsList.innerHTML = submissions.map(submission => {
                const initial = submission.order && submission.order.businessName ? submission.order.businessName.charAt(0).toUpperCase() : '?';
                const status = getStatusLabel(submission.status);
                const statusClass = getStatusClass(submission.status);
                const key = submission.firebaseKey || submission.id;
                const businessName = submission.order && submission.order.businessName ? submission.order.businessName : 'Unknown';
                const businessType = submission.order && submission.order.businessTypeLabel ? submission.order.businessTypeLabel : 'Unknown';
                const websiteLevel = submission.order && submission.order.websiteLevelLabel ? submission.order.websiteLevelLabel : 'Unknown';
                const dateStr = submission.date ? new Date(submission.date).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }) : '';
                return `
                    <div class="client-card" data-id="${key}">
                        <div class="client-info">
                            <div class="client-avatar">${initial}</div>
                            <div>
                                <div class="client-name">${businessName}</div>
                                <div class="client-meta">${businessType} • ${websiteLevel} • ${dateStr}</div>
                            </div>
                        </div>
                        <div style="display:flex;align-items:center;gap:10px">
                            <span class="status-badge ${statusClass}">${status}</span>
                            <select class="status-select" data-key="${key}">
                                <option value="New" ${status === 'New' ? 'selected' : ''}>New</option>
                                <option value="In Review" ${status === 'In Review' ? 'selected' : ''}>In Review</option>
                                <option value="Approved" ${status === 'Approved' ? 'selected' : ''}>Approved</option>
                            </select>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Delegated event handling for client cards (works even if inline
        // onclick handlers are blocked, e.g. by a CSP header or extensions)
        (function setupClientsListDelegation() {
            const clientsList = document.getElementById('clientsList');
            if (!clientsList) return;

            // Open client detail when a card is clicked (ignore clicks on the status select)
            clientsList.addEventListener('click', function(e) {
                if (e.target.closest('select, option, .status-select')) return;
                const card = e.target.closest('.client-card');
                if (card && card.dataset.id) {
                    showClientDetail(card.dataset.id);
                }
            });

            // Update status when the dropdown changes
            clientsList.addEventListener('change', function(e) {
                const sel = e.target.closest('select.status-select');
                if (!sel) return;
                const id = sel.getAttribute('data-key') || (sel.closest('.client-card') || {}).dataset?.id;
                if (id) {
                    updateStatus(id, sel.value, e);
                }
            });
        })();

        // Toggle status dropdown menu
        function toggleStatusMenu(id, event) {
            event.stopPropagation();
            // Close all other menus
            document.querySelectorAll('.status-dropdown-menu').forEach(menu => menu.classList.remove('show'));
            // Toggle this menu
            const menu = document.getElementById(`statusMenu-${id}`);
            menu.classList.toggle('show');
        }

        // Update client status
        function updateStatus(id, newStatus, event) {
            if (event && event.stopPropagation) event.stopPropagation();
            
            // Find submission in allSubmissions array
            const submission = allSubmissions.find(s => s.id === id || s.firebaseKey === id);
            
            if (submission && submission.firebaseKey) {
                try {
                    if (typeof firebase !== 'undefined' && firebase.database) {
                        const database = firebase.database();
                        database.ref('submissions/' + submission.firebaseKey).update({
                            status: newStatus
                        }).then(function() {
                            console.log('Status updated in Firebase');
                        }).catch(function(error) {
                            console.error('Firebase update error:', error);
                        });
                    }
                } catch (err) {
                    console.warn('Firebase update error:', err);
                }
            }
            
            // Close all dropdowns
            document.querySelectorAll('.status-dropdown-menu').forEach(menu => menu.classList.remove('show'));
        }

        // Close dropdowns when clicking outside
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.status-dropdown')) {
                document.querySelectorAll('.status-dropdown-menu').forEach(menu => menu.classList.remove('show'));
            }
        });
