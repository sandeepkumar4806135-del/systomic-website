    <style>

        }

        }

        }

        label {

        input[type="email"],

        .btn {

        .dashboard.show {

        .sidebar {
            position: fixed;

        .sidebar-logo {

        }

        .status-badge.status-review {
            background: rgba(255, 217, 61, 0.1);
            color: #FFD93D;
            border-color: rgba(255, 217, 61, 0.2);

            color: #38ef7d;

        }

            transform: scale(1.05);

        .status-dropdown {
            position: relative;
            display: inline-block;
        }

        .status-dropdown-menu {

            right: 0;
            top: 100%;

        .status-badge.relative {

        .status-badge.relative .status-dropdown-menu {

        .badge {

        .badge-purple {

        .badge-green {

        .badge-yellow {

        .detail-section {

        .detail-section-title {

        .tags-list {

        .tag {

        .empty-state {

        .empty-state .icon {

<body ontouchstart="">
    <!-- Login Page -->
    <div class="login-page" id="loginPage">
        <div class="login-container">
            <div class="login-logo">
                <h1>SYSTOMIC</h1>
                <p>Admin Dashboard</p>
            </div>
            <div class="login-title">Sign In</div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="adminEmail">Email</label>
                    <input type="email" id="adminEmail" placeholder="Enter admin email" required>
                </div>
                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <input type="password" id="adminPassword" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn">Login →</button>
                <div class="error-message" id="loginError">Invalid email or password</div>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div class="dashboard" id="dashboard">
        <div class="sidebar">
            <div class="sidebar-logo">SYSTOMIC</div>
            <div class="sidebar-nav">
                <div class="nav-item active" id="navClients" onclick="showView('clients')">
                    <span class="icon">👥</span>
                    <span>Clients</span>
                </div>
            </div>
            <div class="logout-btn" onclick="logout()">
                <span class="icon">🚪</span>
                <span>Logout</span>
            </div>
        </div>

        <div class="main-content">
            <!-- Clients List View -->
            <div id="viewClients">
                <div class="page-title">Clients</div>
                <div class="stats-grid" id="statsGrid"></div>
                <div class="clients-list" id="clientsList"></div>
            </div>

            <!-- Client Detail View -->
            <div class="detail-view" id="viewDetail">
                <button class="back-btn" onclick="showView('clients')">← Back to Clients</button>
                <div id="clientDetail"></div>
            </div>
        </div>
    </div>

    <script>
        // Admin credentials
        const ADMIN_EMAIL = 'ram@gmail.com';
        const ADMIN_PASSWORD = 'ram129';

        // Check if already logged in
        if (localStorage.getItem('systomicAdminLoggedIn') === 'true') {
            showDashboard();
        }

        // Login handler
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;

            if (email === ADMIN_EMAIL && password === ADMIN_PASSWORD) {
                localStorage.setItem('systomicAdminLoggedIn', 'true');
                showDashboard();
            } else {
                document.getElementById('loginError').classList.add('show');
            }
        });

        // Show dashboard
        function showDashboard() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('dashboard').classList.add('show');
            renderClients();
            setupFirebaseListener();
        }

        // Setup Firebase real-time listener
        function setupFirebaseListener() {
            try {
                if (typeof firebase !== 'undefined' && firebase.database) {
                    const database = firebase.database();
                    const submissionsRef = database.ref('submissions');
                    
                    // Listen for new submissions in real-time
                    submissionsRef.on('value', function(snapshot) {
                        allSubmissions = [];
                        snapshot.forEach(function(childSnapshot) {
                            const data = childSnapshot.val();
                            data.firebaseKey = childSnapshot.key;
                            allSubmissions.push(data);
                        });
                        renderClients();
                    });
                    
                    console.log('Firebase real-time listener active');
                }
            } catch (err) {
                console.warn('Firebase listener error:', err);
            }
        }

        // Logout
        function logout() {
            localStorage.removeItem('systomicAdminLoggedIn');
            window.location.reload();
        }

        // View switching
        function showView(view) {
            document.getElementById('viewClients').style.display = view === 'clients' ? 'block' : 'none';
            document.getElementById('viewDetail').classList.toggle('show', view === 'detail');
            
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            document.getElementById('navClients').classList.add('active');
        }

        // Global submissions array
        let allSubmissions = [];

        // Get status label
        function getStatusLabel(status) {
            return status || 'New';
        }

        // Get status class
        function getStatusClass(status) {
            const s = status || 'New';
            return 'status-' + s.toLowerCase().replace(/\s+/g, '-');
        }

        // Render clients from Firebase data
        function renderClients() {
            const submissions = allSubmissions;
            
            // Stats
            const statsGrid = document.getElementById('statsGrid');
            const totalClients = submissions.length;
            const totalRestaurants = submissions.filter(s => s.order && s.order.businessType === 'restaurants').length;
            const totalPremium = submissions.filter(s => s.order && s.order.websiteLevel === 'premium').length;
            const totalNew = submissions.filter(s => (s.status || 'New') === 'New').length;
            
            statsGrid.innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${totalClients}</div>
                    <div class="stat-label">Total Clients</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${totalNew}</div>
                    <div class="stat-label">New</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${submissions.filter(s => (s.status || 'New') === 'In Review').length}</div>
                    <div class="stat-label">In Review</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${submissions.filter(s => (s.status || 'New') === 'Approved').length}</div>
                    <div class="stat-label">Approved</div>
                </div>
            `;

            // Clients list
            const clientsList = document.getElementById('clientsList');

            if (submissions.length === 0) {
                clientsList.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <p>No client submissions yet</p>
                    </div>
                `;
                return;
            }

            // Sort by newest first
            submissions.sort((a, b) => {
                const dateA = new Date(a.date || 0);
                const dateB = new Date(b.date || 0);
                return dateB - dateA;
            });

            clientsList.innerHTML = submissions.map(submission => {
                const initial = submission.order && submission.order.businessName ? submission.order.businessName.charAt(0).toUpperCase() : '?';
                const status = getStatusLabel(submission.status);
                const statusClass = getStatusClass(submission.status);
                return `
                    <div class="client-card" onclick="showClientDetail(${submission.id})">
                        <div class="client-info">
                            <div class="client-avatar">${initial}</div>
                            <div>
                                <div class="client-name">${submission.order.businessName}</div>
                                <div class="client-meta">${submission.order.businessTypeLabel} • ${submission.order.websiteLevelLabel} • ${submission.date}</div>
                            </div>
                        </div>
                        <div class="client-card-header" onclick="event.stopPropagation()">
                            <div class="status-dropdown">
                                <span class="status-badge ${statusClass}" onclick="toggleStatusMenu(${submission.id}, event)">${status} ▾</span>
                                <div class="status-dropdown-menu" id="statusMenu-${submission.id}">
                                    <div class="status-option dot-new ${status === 'New' ? 'active' : ''}" onclick="updateStatus(${submission.id}, 'New', event)">New</div>
                                    <div class="status-option dot-review ${status === 'In Review' ? 'active' : ''}" onclick="updateStatus(${submission.id}, 'In Review', event)">In Review</div>
                                    <div class="status-option dot-approved ${status === 'Approved' ? 'active' : ''}" onclick="updateStatus(${submission.id}, 'Approved', event)">Approved</div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Toggle status dropdown menu
        function toggleStatusMenu(id, event) {
            event.stopPropagation();
            // Close all other menus
            document.querySelectorAll('.status-dropdown-menu').forEach(menu => menu.classList.remove('show'));
            // Toggle this menu
            const menu = document.getElementById(`statusMenu-${id}`);
            menu.classList.toggle('show');
        }

        // Update client status
        function updateStatus(id, newStatus, event) {
            event.stopPropagation();
            
            // Find submission in allSubmissions array
            const submission = allSubmissions.find(s => s.id === id || s.firebaseKey === id);
            
            if (submission && submission.firebaseKey) {
                try {
                    if (typeof firebase !== 'undefined' && firebase.database) {
                        const database = firebase.database();
                        database.ref('submissions/' + submission.firebaseKey).update({
                            status: newStatus
                        }).then(function() {
                            console.log('Status updated in Firebase');
                        }).catch(function(error) {
                            console.error('Firebase update error:', error);
                        });
                    }
                } catch (err) {
                    console.warn('Firebase update error:', err);
                }
            }
            
            // Close all dropdowns
            document.querySelectorAll('.status-dropdown-menu').forEach(menu => menu.classList.remove('show'));
        }

        // Close dropdowns when clicking outside
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.status-dropdown')) {
                document.querySelectorAll('.status-dropdown-menu').forEach(menu => menu.classList.remove('show'));
            }
        });

        // Show client detail
        function showClientDetail(id) {
            const submission = allSubmissions.find(s => s.id === id || s.firebaseKey === id);

            if (!submission) {
                alert('Client not found');
                return;
            }

            const { order, details, url, date } = submission;
            const statusLabel = getStatusLabel(submission.status);
            const statusClass = getStatusClass(submission.status);

            const socialMediaHtml = Object.entries(details.socialMedia || {}).map(([platform, link]) => `
                <div class="detail-item">
                    <span class="detail-label">${platform}</span>
                    <span class="detail-value">${link || 'Not provided'}</span>
                </div>
            `).join('') || '<span class="detail-value">None selected</span>';

            document.getElementById('clientDetail').innerHTML = `
                <div class="detail-header">
                    <h2>${order.businessName}</h2>
                    <div class="detail-badges">
                        <span class="badge badge-purple">${order.businessTypeLabel}</span>
                        <span class="badge badge-green">${order.websiteLevelLabel}</span>
                        <span class="badge badge-yellow">Submitted ${date}</span>
                        <span class="status-badge ${statusClass} relative" onclick="toggleStatusMenu('detail-' + ${submission.id}, event)">${statusLabel} ▾
                            <div class="status-dropdown-menu" id="statusMenu-detail-${submission.id}">
                                <div class="status-option dot-new ${statusLabel === 'New' ? 'active' : ''}" onclick="updateStatus(${submission.id}, 'New', event)">New</div>
                                <div class="status-option dot-review ${statusLabel === 'In Review' ? 'active' : ''}" onclick="updateStatus(${submission.id}, 'In Review', event)">In Review</div>
                                <div class="status-option dot-approved ${statusLabel === 'Approved' ? 'active' : ''}" onclick="updateStatus(${submission.id}, 'Approved', event)">Approved</div>
                            </div>
                        </span>
                    </div>
                    <div class="tags-list" style="margin-top: 15px;">
                        ${order.brandTheme ? `<span class="tag">🎨 ${order.brandTheme}</span>` : ''}
                        ${order.brandColor ? `<span class="tag" style="background: ${order.brandColor}; color: white;">Brand Color Selected</span>` : ''}
                        ${order.logoName ? '<span class="tag">📁 Logo</span>' : ''}
                        ${order.photosCount > 0 ? `<span class="tag">🖼️ ${order.photosCount} photos</span>` : ''}
                        ${order.videosCount > 0 ? `<span class="tag">🎬 ${order.videosCount} videos</span>` : ''}
                    </div>
                </div>

                <div class="detail-section">
                    <div class="detail-section-title">Contact Information</div>
                    <div class="detail-item">
                        <span class="detail-label">Business Name</span>
                        <span class="detail-value">${order.businessName}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Phone</span>
                        <span class="detail-value">${order.phone}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Email</span>
                        <span class="detail-value">${order.email}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Address</span>
                        <span class="detail-value">${order.address}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">WhatsApp</span>
                        <span class="detail-value">${order.whatsapp}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Admin Email</span>
                        <span class="detail-value">${order.adminEmail}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Admin Password</span>
                        <span class="detail-value">${order.adminPassword}</span>
                    </div>
                </div>

                <div class="detail-section">
                    <div class="detail-section-title">Website Plan</div>
                    <div class="detail-item">
                        <span class="detail-label">Website Level</span>
                        <span class="detail-value">${order.websiteLevelLabel}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Project Type</span>
                        <span class="detail-value">${details.projectType || 'Not specified'}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Business Type</span>
                        <span class="detail-value">${order.businessTypeLabel}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Year Established</span>
                        <span class="detail-value">${details.yearEstablished}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Website URL</span>
                        <span class="detail-value"><a href="${url}" target="_blank" class="url-link">${url}</a></span>
                    </div>
                </div>

                <div class="detail-section">
                    <div class="detail-section-title">Business Information</div>
                    <div class="detail-item">
                        <span class="detail-label">Company Description</span>
                        <span class="detail-value">${details.companyDescription}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Top 3 Goals</span>
                        <span class="detail-value">${details.topGoals}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Target Audience</span>
                        <span class="detail-value">${(details.targetAudience || []).join(', ') || 'Not selected'}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Business Goals</span>
                        <span class="detail-value">${(details.businessGoals || []).join(', ') || 'Not selected'}</span>
                    </div>
                </div>

                <div class="detail-section">
                    <div class="detail-section-title">Competitor Research</div>
                    <div class="detail-item">
                        <span class="detail-label">Websites They Like</span>
                        <span class="detail-value">${details.competitorLikes}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Features Liked</span>
                        <span class="detail-value">${details.featuresLiked || 'Not provided'}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Features Disliked</span>
                        <span class="detail-value">${details.featuresDisliked || 'Not provided'}</span>
                    </div>
                </div>

                <div class="detail-section">
                    <div class="detail-section-title">Website Pages</div>
                    <div class="tags-list">
                        ${(details.websitePages || []).map(page => `<span class="tag">${page}</span>`).join('') || '<span class="tag">None selected</span>'}
                    </div>
                    <div style="margin-top: 15px;">
                        <div class="detail-section-title" style="font-size: 1rem;">Social Media</div>
                        ${socialMediaHtml}
                    </div>
                </div>

                <div class="detail-section">
                    <div class="detail-section-title">Website Features</div>
                    <div class="tags-list">
                        ${(details.websiteFeatures || []).map(feature => `<span class="tag">${feature}</span>`).join('') || '<span class="tag">None selected</span>'}
                    </div>
                </div>

                <div class="detail-section">
                    <div class="detail-section-title">Niche-Specific Selections</div>
                    <div class="tags-list">
                        ${(details.nicheSelections || []).map(item => `<span class="tag">${item}</span>`).join('') || '<span class="tag">None selected</span>'}
                    </div>
                </div>

                <div class="detail-section">
                    <div class="detail-section-title">Technical Details</div>
                    <div class="detail-item">
                        <span class="detail-label">Has Domain</span>
                        <span class="detail-value">${details.hasDomain || 'Not specified'}${details.domainName ? ` (${details.domainName})` : ''}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Has Hosting</span>
                        <span class="detail-value">${details.hasHosting || 'Not specified'}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Existing Website</span>
                        <span class="detail-value">${details.existingWebsite || 'Not specified'}${details.existingUrl ? ` (${details.existingUrl})` : ''}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Platforms Needed</span>
                        <span class="detail-value">${(details.platforms || []).join(', ') || 'Not specified'}</span>
                    </div>
                </div>
            `;

            showView('detail');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
